[project]
name = "sourcing-radar-collector"
version = "0.1.0"
description = "해외 인기 상품 추적 + 국내 경쟁 분석으로 소싱 후보를 점수화하는 수집기"
requires-python = ">=3.11"
dependencies = [
    "httpx>=0.27",
    "python-dotenv>=1.0",
    "pyyaml>=6.0",
    "supabase>=2.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]
# Phase 2 이후에 필요한 것들 (지금은 설치 안 해도 됨)
scrape = [
    "playwright>=1.45",
    "pandas>=2.2",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["config", "sources", "db"]
